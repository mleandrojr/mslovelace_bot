[package]
name = "mslovelace_bot"
version = "3.0.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde_json = "1.0.150"
dotenv = "0.15.0"
chrono = "0.4.44"
tokio = { "version" = "1.52.3", features = ["full"] }
serde = { "version" = "1.0.228", features = ["derive"] }
sqlx = { "version" = "0.9.0", features = ["runtime-tokio", "mysql", "chrono"] }
reqwest = { version = "0.12", features = ["json"] }
sqlxx = "0.1.5"
